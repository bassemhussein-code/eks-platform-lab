# EC2NodeClass = the AWS-specific "how": AMI, subnets, security groups, IAM role, disks.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: {{ .Values.nodeRoleName }}

  # al2023@latest -> picks up new AMIs automatically -> Karpenter marks nodes as
  # "drifted" and replaces them (respecting disruption budgets).
  # Prod: pin e.g. al2023@v20261101 and promote AMI versions dev -> staging -> prod.
  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName }}

  # IMDSv2 only, hop limit 1: pods cannot steal the NODE role's credentials.
  # (Security scanners like Wiz flag hop limit 2 + IMDSv1.)
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  tags:
    team: platform
