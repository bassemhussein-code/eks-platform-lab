{{- $a := .Values.addons -}}
{{- $c := .Values.cluster -}}

{{- if $a.istio.enabled }}
---
# Istio CNI node agent: sets up traffic redirection into ztunnel (ambient)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ $a.istio.repoURL }}
    chart: cni
    targetRevision: {{ $a.istio.chartVersion | quote }}
    helm:
      valuesObject:
        profile: ambient
  destination:
    {{- include "lab.destination" "istio-system" | nindent 4 }}
  syncPolicy:
    {{- include "lab.syncPolicy" . | nindent 4 }}
---
# ztunnel: per-node L4 proxy (mTLS, L4 authz, telemetry) for ambient workloads
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ztunnel
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ $a.istio.repoURL }}
    chart: ztunnel
    targetRevision: {{ $a.istio.chartVersion | quote }}
  destination:
    {{- include "lab.destination" "istio-system" | nindent 4 }}
  syncPolicy:
    {{- include "lab.syncPolicy" . | nindent 4 }}
{{- end }}

