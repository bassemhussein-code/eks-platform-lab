{{- if $a.falco.enabled }}
---
# Falco: runtime threat detection (syscalls via modern eBPF probe)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: {{ $a.falco.chartVersion | quote }}
    helm:
      valuesObject:
        driver:
          kind: modern_ebpf
        tty: true
        falco:
          json_output: true
        customRules:
          lab-rules.yaml: |-
            - rule: Package manager run in container
              desc: >
                A package manager ran inside a running container. Images should be
                immutable -- installing packages at runtime is drift or an attacker.
              condition: >
                spawned_process and container
                and proc.name in (apt, apt-get, apk, yum, dnf, pip, pip3)
              output: >
                Package manager run in container (user=%user.name cmd=%proc.cmdline
                pod=%k8s.pod.name ns=%k8s.ns.name image=%container.image.repository)
              priority: WARNING
              tags: [lab, drift, mitre_persistence]
  destination:
    {{- include "lab.destination" "falco" | nindent 4 }}
  syncPolicy:
    {{- include "lab.syncPolicy" . | nindent 4 }}
{{- end }}

{{- if $a.demoWorkloads.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: gitops/charts/demo-workloads
    helm:
      valuesObject:
        clusterName: {{ $c.name }}
        accountId: {{ $c.accountId | quote }}
        region: {{ $c.region }}
        exposeDemo: {{ $a.demoWorkloads.exposeDemo }}
        allowedCidr: {{ $a.demoWorkloads.allowedCidr | quote }}
  destination:
    {{- include "lab.destination" "default" | nindent 4 }}
  syncPolicy:
    {{- include "lab.syncPolicy" . | nindent 4 }}
{{- end }}
