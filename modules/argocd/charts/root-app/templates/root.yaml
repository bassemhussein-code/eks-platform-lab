apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
  # No finalizer on purpose: deleting the root app must NOT cascade-delete
  # every add-on (Karpenter would vanish while its EC2 nodes keep running).
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: gitops/bootstrap
    helm:
      valuesObject:
{{ toYaml .Values | indent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
